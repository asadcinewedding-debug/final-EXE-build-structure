name: Build AN AI Relight V6 Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build EXE
        run: |
          dotnet publish engine/AN_AI_Relight.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o build

      - name: Package runtime
        run: |
          mkdir package
          copy build\*.exe package\
          xcopy runtime package\runtime /E /I
          copy requirements.txt package\

      - name: Upload installer package
        uses: actions/upload-artifact@v4
        with:
          name: AN-AI-Relight-V6-Windows
          path: package
