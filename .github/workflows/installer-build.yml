name: Build AN AI Relight V6 Installer

on:
  workflow_run:
    workflows:
      - "Build AN AI Relight V6 Windows EXE"
    types:
      - completed

jobs:
  installer:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: AN-AI-Relight-V6-Windows
          path: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

     - name: Build Installer
  shell: powershell
  run: |
    Copy-Item build\AN_AI_Relight.exe installer\build\AN_AI_Relight.exe
    mkdir installer_output
    iscc installer/setup.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: AN-AI-Relight-V6-Installer
          path: installer_output
